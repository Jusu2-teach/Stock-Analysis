# ═══════════════════════════════════════════════════════════════════════════════
# AStock Evaluators v2.1 - 自适应阈值配置
# ═══════════════════════════════════════════════════════════════════════════════
#
# 设计原则:
#   动态阈值 = 基准 × 行业系数 × 规模系数 + 周期调整
#
# 注意: 字段名必须与 adaptive_threshold.py 的 ThresholdSet 一致:
#   excellent, good, acceptable, poor, veto
# 指标键名必须与 with_defaults() 及 engine.py 的查询一致:
#   roic_level, roic_trend, roe_level, revenue_growth,
#   gross_margin, net_margin, ocf_ratio
# ═══════════════════════════════════════════════════════════════════════════════

metadata:
  version: "2.1.0"
  description: "自适应阈值配置 - 与代码命名对齐"

# ═══════════════════════════════════════════════════════════════════════════════
# 基准阈值（全市场中位数水平）
# 字段: excellent, good, acceptable, poor, veto
# ═══════════════════════════════════════════════════════════════════════════════
base_thresholds:
  # ROIC 绝对水平阈值 (A股校准)
  roic_level:
    excellent: 12.0       # 优秀 (A股P75)
    good: 8.0             # 良好 (A股P50)
    acceptable: 5.0       # 一般 (A股P25)
    poor: 2.0             # 较差
    veto: -5.0            # 否决线（允许短期亏损）

  # ROIC 趋势斜率阈值
  roic_trend:
    excellent: 0.02       # 强势改善
    good: 0.01            # 稳步改善
    acceptable: 0.0       # 持平
    poor: -0.01           # 轻微恶化
    veto: -0.05           # 严重恶化

  # ROE 绝对水平阈值 (A股校准)
  roe_level:
    excellent: 15.0
    good: 10.0
    acceptable: 6.0
    poor: 3.0
    veto: -5.0

  # 营收增长率阈值
  revenue_growth:
    excellent: 0.15
    good: 0.08
    acceptable: 0.03
    poor: -0.02
    veto: -0.15

  # 毛利率阈值
  gross_margin:
    excellent: 35.0
    good: 25.0
    acceptable: 15.0
    poor: 8.0
    veto: 0.0

  # 净利率阈值
  net_margin:
    excellent: 12.0
    good: 8.0
    acceptable: 4.0
    poor: 1.0
    veto: -5.0

  # 经营现金流比率阈值
  ocf_ratio:
    excellent: 1.2
    good: 0.9
    acceptable: 0.7
    poor: 0.4
    veto: 0.0

  # 自由现金流利润率阈值 (%)
  fcf_margin:
    excellent: 12.0       # 优秀: FCF/Revenue > 12%
    good: 7.0             # 良好
    acceptable: 3.0       # 一般
    poor: 0.0             # 较差 (不产生自由现金流)
    veto: -10.0           # 严重烧钱

  # 资产周转率阈值 (次/年)
  asset_turnover:
    excellent: 1.20       # 高效率
    good: 0.80            # 良好
    acceptable: 0.50      # 一般
    poor: 0.30            # 低效率
    veto: 0.10            # 极低效率

# ═══════════════════════════════════════════════════════════════════════════════
# 行业调整系数
# 键名必须与 IndustryCategory 枚举值匹配:
#   technology, healthcare, consumer_staples, consumer_discretionary,
#   financials, industrials, materials, energy, utilities,
#   real_estate, telecom
# ═══════════════════════════════════════════════════════════════════════════════
industry_multipliers:
  technology:
    roic_level: 1.20
    roic_trend: 1.20
    roe_level: 1.10
    revenue_growth: 1.50
    gross_margin: 1.20
    net_margin: 1.30
    fcf_margin: 1.10           # 科技公司 FCF 要求不高 (大量研发投入)
    asset_turnover: 0.80       # 科技公司资产周转率较低

  healthcare:
    roic_level: 1.10
    roic_trend: 1.00
    roe_level: 1.10
    revenue_growth: 1.20
    gross_margin: 1.30
    net_margin: 1.20
    fcf_margin: 1.00
    asset_turnover: 0.90

  consumer_staples:
    roic_level: 1.20
    roe_level: 1.10
    gross_margin: 1.30
    net_margin: 1.20
    fcf_margin: 1.20           # 必选消费 FCF 应稳定较高
    asset_turnover: 1.10

  consumer_discretionary:
    roic_level: 1.00
    roe_level: 1.00
    revenue_growth: 1.10
    gross_margin: 0.90
    fcf_margin: 0.90
    asset_turnover: 1.10

  financials:
    roic_level: 0.60
    roic_trend: 0.80
    roe_level: 0.80
    revenue_growth: 0.70
    gross_margin: null      # 不适用
    net_margin: 0.80
    fcf_margin: null           # 金融业 FCF 不适用
    asset_turnover: null       # 金融业资产周转不适用

  industrials:
    roic_level: 0.90
    revenue_growth: 0.90
    gross_margin: 0.80
    net_margin: 0.80
    fcf_margin: 0.90
    asset_turnover: 0.90

  materials:
    roic_level: 0.80
    roe_level: 0.80
    gross_margin: 0.70
    net_margin: 0.70
    revenue_growth: 0.80
    fcf_margin: 0.80
    asset_turnover: 0.80

  energy:
    roic_level: 0.80
    roe_level: 0.80
    gross_margin: 0.60
    net_margin: 0.70
    fcf_margin: 0.70           # 能源行业 capex 重
    asset_turnover: 0.70

  utilities:
    roic_level: 0.70
    roic_trend: 0.80
    roe_level: 0.80
    revenue_growth: 0.50
    gross_margin: 0.60
    net_margin: 0.70
    fcf_margin: 0.60           # 公用事业 capex 极重
    asset_turnover: 0.50

  real_estate:
    roic_level: 0.70
    roe_level: 0.80
    revenue_growth: 0.60
    gross_margin: 0.70
    net_margin: 0.70
    fcf_margin: 0.50           # 房地产 FCF 极度波动
    asset_turnover: 0.40

  telecom:
    roic_level: 0.80
    revenue_growth: 0.60
    gross_margin: 0.90
    net_margin: 0.80
    fcf_margin: 0.80
    asset_turnover: 0.60

# ═══════════════════════════════════════════════════════════════════════════════
# 规模调整系数
# 键名必须与 SizeTier 枚举值匹配:
#   mega_cap, large_cap, mid_cap, small_cap
# 值为各指标的乘数
# ═══════════════════════════════════════════════════════════════════════════════
size_tier_multipliers:
  mega_cap:
    revenue_growth: 0.70      # 大盘股增长预期较低
    roic_level: 1.0
    roe_level: 1.0

  large_cap:
    revenue_growth: 0.90
    roic_level: 1.0
    roe_level: 1.0

  mid_cap:
    revenue_growth: 1.10
    roic_level: 1.0
    roe_level: 1.0

  small_cap:
    revenue_growth: 1.30      # 小盘股增长预期较高
    roic_level: 0.90
    roe_level: 0.90

# ═══════════════════════════════════════════════════════════════════════════════
# 市场周期调整（加法偏移）
# 键名必须与 MarketCycle 枚举值匹配:
#   expansion, peak, contraction, trough
# ═══════════════════════════════════════════════════════════════════════════════
market_cycle_adjustments:
  expansion:
    roic_level: 0.0
    revenue_growth: 0.0

  peak:
    roic_level: 1.0           # 顶部适度提高要求
    revenue_growth: 0.02

  contraction:
    roic_level: -2.0          # 收缩期降低要求
    revenue_growth: -0.05
    net_margin: -1.0

  trough:
    roic_level: -3.0          # 底部大幅降低要求
    revenue_growth: -0.08
    net_margin: -2.0
