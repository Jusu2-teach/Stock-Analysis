# ═══════════════════════════════════════════════════════════════════════════════
# AStock Evaluators v2.0 - 状态机配置
# ═══════════════════════════════════════════════════════════════════════════════
#
# 公司生命周期状态机
# 建模企业在不同状态间的转移概率
# ═══════════════════════════════════════════════════════════════════════════════

metadata:
  version: "2.0.0"
  description: "公司状态机配置"

# ═══════════════════════════════════════════════════════════════════════════════
# 状态定义
# ═══════════════════════════════════════════════════════════════════════════════
states:
  # 正常生命周期状态
  emerging:
    name: "新兴成长"
    description: "高增长、低盈利、高波动的早期阶段"
    characteristics:
      revenue_growth: [0.30, 1.00]
      roic_level: [-5.0, 10.0]
      roic_trend: [0.0, 0.20]
      volatility: [0.30, 0.70]
    investment_implication: "高风险高回报，关注商业模式验证"
    typical_duration_years: [2, 5]
    quality_class: "uncertain"

  growth:
    name: "快速成长"
    description: "高增长、盈利改善的成长期"
    characteristics:
      revenue_growth: [0.08, 0.50]
      roic_level: [5.0, 25.0]
      roic_trend: [0.0, 0.15]
      volatility: [0.15, 0.35]
    investment_implication: "成长股投资，关注增速持续性"
    typical_duration_years: [3, 7]
    quality_class: "quality"

  mature:
    name: "成熟稳定"
    description: "低增长、高盈利、低波动的成熟期"
    characteristics:
      revenue_growth: [0.0, 0.15]
      roic_level: [6.0, 20.0]
      roic_trend: [-0.02, 0.05]
      volatility: [0.05, 0.20]
    investment_implication: "价值股投资，关注分红和估值"
    typical_duration_years: [5, 15]
    quality_class: "quality"

  cash_cow:
    name: "现金牛"
    description: "低增长、高ROIC、高分红的稳定期"
    characteristics:
      revenue_growth: [-0.05, 0.10]
      roic_level: [12.0, 25.0]
      roic_trend: [-0.03, 0.03]
      volatility: [0.03, 0.15]
    investment_implication: "长期持有，稳定收息"
    typical_duration_years: [5, 20]
    quality_class: "quality"

  # 过渡状态
  slowing:
    name: "增速放缓"
    description: "从成长转向成熟的过渡期"
    characteristics:
      revenue_growth: [0.02, 0.15]
      roic_level: [5.0, 18.0]
      roic_trend: [-0.05, 0.02]
      volatility: [0.10, 0.30]
    investment_implication: "关注转型能力，可能重新加速或进入成熟"
    typical_duration_years: [1, 3]
    quality_class: "uncertain"

  declining:
    name: "衰退期"
    description: "负增长、盈利下滑的衰退期"
    characteristics:
      revenue_growth: [-0.15, 0.0]
      roic_level: [3.0, 12.0]
      roic_trend: [-0.10, -0.02]
      volatility: [0.15, 0.40]
    investment_implication: "风险较高，关注是否有反转可能"
    typical_duration_years: [2, 5]
    quality_class: "poor"

  # 特殊状态
  distressed:
    name: "困境期"
    description: "亏损、现金流紧张的危机状态"
    characteristics:
      revenue_growth: [-0.30, 0.0]
      roic_level: [-20.0, 0.0]
      roic_trend: [-0.20, 0.0]
      volatility: [0.50, 1.00]
    investment_implication: "高风险，可能破产或反转"
    typical_duration_years: [1, 3]
    quality_class: "poor"

  turnaround:
    name: "反转期"
    description: "触底回升的反转状态"
    characteristics:
      revenue_growth: [0.0, 0.30]
      roic_level: [-5.0, 10.0]
      roic_trend: [0.05, 0.25]
      volatility: [0.25, 0.50]
    investment_implication: "逆向投资机会，需验证反转真实性"
    typical_duration_years: [1, 3]
    quality_class: "uncertain"

  cyclical_peak:
    name: "周期顶"
    description: "周期股高点，盈利高峰"
    characteristics:
      revenue_growth: [0.10, 0.50]
      roic_level: [15.0, 40.0]
      roic_trend: [0.05, 0.20]
      volatility: [0.20, 0.50]
    investment_implication: "警惕周期下行风险"
    typical_duration_years: [1, 2]
    quality_class: "uncertain"

  cyclical_trough:
    name: "周期底"
    description: "周期股低点，盈利低谷"
    characteristics:
      revenue_growth: [-0.30, 0.05]
      roic_level: [-5.0, 8.0]
      roic_trend: [-0.15, 0.05]
      volatility: [0.30, 0.60]
    investment_implication: "周期底部机会，但需确认周期拐点"
    typical_duration_years: [1, 3]
    quality_class: "uncertain"

# ═══════════════════════════════════════════════════════════════════════════════
# 状态转移矩阵
# P(next_state | current_state)
# ═══════════════════════════════════════════════════════════════════════════════
transition_matrix:
  emerging:
    emerging: 0.40
    growth: 0.35
    distressed: 0.15
    slowing: 0.10

  growth:
    growth: 0.55
    mature: 0.20
    slowing: 0.15
    distressed: 0.05
    cash_cow: 0.05

  mature:
    mature: 0.65
    cash_cow: 0.15
    declining: 0.10
    growth: 0.05     # 二次成长
    slowing: 0.05

  cash_cow:
    cash_cow: 0.70
    mature: 0.15
    declining: 0.10
    distressed: 0.05

  slowing:
    mature: 0.40
    growth: 0.25     # 重新加速
    declining: 0.20
    slowing: 0.15

  declining:
    declining: 0.45
    distressed: 0.25
    turnaround: 0.15
    mature: 0.10
    cash_cow: 0.05

  distressed:
    distressed: 0.40
    turnaround: 0.30
    declining: 0.30

  turnaround:
    growth: 0.35
    mature: 0.25
    turnaround: 0.20
    distressed: 0.15  # 假反转
    slowing: 0.05

  cyclical_peak:
    cyclical_peak: 0.30
    slowing: 0.35
    declining: 0.25
    cyclical_trough: 0.10

  cyclical_trough:
    cyclical_trough: 0.35
    turnaround: 0.30
    cyclical_peak: 0.20
    distressed: 0.10
    growth: 0.05

# ═══════════════════════════════════════════════════════════════════════════════
# 状态质量分类（用于最终评估）
# ═══════════════════════════════════════════════════════════════════════════════
quality_classification:
  quality:
    states: ["growth", "mature", "cash_cow"]
    base_score_bonus: 5

  uncertain:
    states: ["emerging", "slowing", "turnaround", "cyclical_peak", "cyclical_trough"]
    base_score_bonus: 0

  poor:
    states: ["declining", "distressed"]
    base_score_penalty: 8
