# DuckDB 财务筛选工作流 (v2.1)
# ========================================
#
# 更新日志 (2025-12-07 v2.1):
# - window_size 增强：
#   - 不配置(注释掉): 使用全部数据计算趋势，有多少年算多少年
#   - 配置为整数N: 只使用最近N年数据计算趋势
# - min_periods: 最低年限要求，数据不足此年限的公司会被跳过
#
# 更新日志 (2025-12-07 v2.0):
# - 新增双窗口设计：全量数据用于断点/周期分析，近N年用于趋势计算
# - 新增 enable_multi_horizon 参数：是否启用多时间窗口分析(默认true)
# - 输出新增字段：has_break(断点), break_idx(断点位置), regime(数据体制)
#
# 更新日志 (2025-12-06):
# - 新增 reference_metrics 交叉验证配置
# - 支持 MetricAdapter 自动调整分析参数
# - 29条规则引擎 (7 veto + 10 penalty + 6 cross-val + 3 cycle + 5 bonus)
# - 5种策略评估 (high_growth, turnaround, stable_dividend, cyclical_bottom, moat_defense)
#
# 参数说明:
# - min_periods: 最少需要的年数(默认5)，数据不足此年限的公司会被跳过
# - window_size: 趋势计算窗口
#   - 不配置: 使用全部数据计算趋势(推荐，有多少年算多少年)
#   - 配置为5: 只使用最近5年数据计算趋势
# - enable_multi_horizon: 是否启用断点检测和周期分析(默认true)
#
# 指标配置说明:
# - roic: 效率指标，核心筛选指标，交叉验证 roe/roiic
# - roiic: 增量指标，辅助指标（不做一票否决），交叉验证 roic
# - total_revenue_ps: 规模指标，验证增长可持续性，交叉验证 roe
# - eps: 规模指标，盈利增长，交叉验证 ocfps（现金含金量）
# - grossprofit_margin: 效率指标，护城河指标，交叉验证 netprofit_margin
# - netprofit_margin: 效率指标，盈利能力
# - roe: 效率指标，股东回报，杜邦分解验证
# - ocfps: 现金流指标，盈利质量验证
#
pipeline:
  name: "DuckDB财务基线筛选管道"
  orchestration:
    granularity: node
    soft_fail: true
    task_runner: "sequential"
    max_workers: 4
    retry_count: 1
    retry_delay: 10
    timeout: 1200

  steps:
    - name: "Load_Financial_Data"
      component: "business_engine"
      engine: "duckdb"
      method: ["load_file"]
      parameters:
        # 使用10年数据（5年数据路径: data/polars/5yd_final_industry.csv）
        path: "data/polars/10yd_final_industry.csv"
      outputs:
        parameters:
          - name: Raw_Data

    # ========== ROIC 趋势分析(三位一体过滤) ==========
    # 核心指标：投入资本回报率，衡量资本效率
    # 交叉验证：ROE（股东视角）、ROIIC（增量效率）
    - name: "Analyze_ROIC_Trend"
      component: "business_engine"
      engine: "duckdb"
      method: ["analyze_metric_trend"]
      parameters:
        data: "steps.Load_Financial_Data.outputs.parameters.Raw_Data"
        group_cols: 'ts_code'
        metric_name: 'roic'
        prefix: ""
        suffix: ""
        min_periods: 5              # 最低5年数据要求
        window_size: 5            # 不配置=使用全部数据；配置5=只用近5年
        enable_multi_horizon: true  # 启用断点检测(使用全量数据)
        reference_metrics: ["roe", "roiic"]  # 交叉验证
      outputs:
        parameters:
          - name: ROIC_Trend_Result

    - name: "store_ROIC_Trend"
      component: "data_engine"
      engine: "pandas"
      method:
        - "store"
      parameters:
        path: "data/filter_middle/roic_trend_analysis.csv"
        format: "csv"
        data: "steps.Analyze_ROIC_Trend.outputs.parameters.ROIC_Trend_Result"

    # ========== 计算派生指标 (ROIIC) ==========
    # ROIIC = 增量NOPAT / 增量投入资本
    # 用于评估新增投资的边际回报率
    - name: "Compute_Derived_Metrics"
      component: "business_engine"
      engine: "duckdb"
      method: ["compute_derived_metrics"]
      parameters:
        data: "steps.Load_Financial_Data.outputs.parameters.Raw_Data"
        group_cols: 'ts_code'
        sort_cols: 'end_date'
        metrics: ["roiic"]
      outputs:
        parameters:
          - name: Data_With_ROIIC

    # ========== ROIIC 趋势分析 (增量资本回报) ==========
    # 辅助指标：增量资本回报率，评估新投资效率
    # 特殊处理：不做一票否决，降低扣分权重
    # 交叉验证：ROIC（存量效率）
    - name: "Analyze_ROIIC_Trend"
      component: "business_engine"
      engine: "duckdb"
      method: ["analyze_metric_trend"]
      parameters:
        data: "steps.Compute_Derived_Metrics.outputs.parameters.Data_With_ROIIC"
        group_cols: 'ts_code'
        metric_name: 'roiic'
        prefix: ""
        suffix: ""
        min_periods: 4              # ROIIC 需要差分，最低4年数据
        window_size: 5
        reference_metrics: ["roic"]  # 交叉验证
      outputs:
        parameters:
          - name: ROIIC_Trend_Result

    - name: "store_ROIIC_Trend"
      component: "data_engine"
      engine: "pandas"
      method:
        - "store"
      parameters:
        path: "data/filter_middle/roiic_trend_analysis.csv"
        format: "csv"
        data: "steps.Analyze_ROIIC_Trend.outputs.parameters.ROIIC_Trend_Result"

    # ========== 营收趋势分析 (规模增长) ==========
    # 交叉验证：ROE（增长效率）+ EPS（增收是否增利）
    - name: "Analyze_Revenue_Trend"
      component: "business_engine"
      engine: "duckdb"
      method: ["analyze_metric_trend"]
      parameters:
        data: "steps.Load_Financial_Data.outputs.parameters.Raw_Data"
        group_cols: 'ts_code'
        metric_name: 'revenue'  # 标准业务键 -> source_column: total_revenue_ps
        prefix: ""
        suffix: ""
        min_periods: 5              # 最低5年数据要求
        window_size: 5            # 不配置=使用全部数据
        reference_metrics: ["roe", "profit"]  # 交叉验证（使用标准业务键）
      outputs:
        parameters:
          - name: Revenue_Trend_Result

    - name: "store_Revenue_Trend"
      component: "data_engine"
      engine: "pandas"
      method:
        - "store"
      parameters:
        path: "data/filter_middle/revenue_trend_analysis.csv"
        format: "csv"
        data: "steps.Analyze_Revenue_Trend.outputs.parameters.Revenue_Trend_Result"

    # ========== 净利润趋势分析 (盈利增长) ==========
    - name: "Analyze_Profit_Trend"
      component: "business_engine"
      engine: "duckdb"
      method: ["analyze_metric_trend"]
      parameters:
        data: "steps.Load_Financial_Data.outputs.parameters.Raw_Data"
        group_cols: 'ts_code'
        metric_name: 'profit'  # 标准业务键 -> source_column: eps
        prefix: ""
        suffix: ""
        min_periods: 5              # 最低5年数据要求
        window_size: 5            # 不配置=使用全部数据
        reference_metrics: ["ocf"]  # 交叉验证（使用标准业务键）
      outputs:
        parameters:
          - name: Profit_Trend_Result

    - name: "store_Profit_Trend"
      component: "data_engine"
      engine: "pandas"
      method:
        - "store"
      parameters:
        path: "data/filter_middle/profit_trend_analysis.csv"
        format: "csv"
        data: "steps.Analyze_Profit_Trend.outputs.parameters.Profit_Trend_Result"

    # ========== 毛利率趋势分析 (护城河) ==========
    # 效率指标：毛利率，衡量产品竞争力和议价能力
    # 交叉验证：净利率（费用控制）
    - name: "Analyze_GrossMargin_Trend"
      component: "business_engine"
      engine: "duckdb"
      method: ["analyze_metric_trend"]
      parameters:
        data: "steps.Load_Financial_Data.outputs.parameters.Raw_Data"
        group_cols: 'ts_code'
        metric_name: 'gross_margin'  # 标准业务键 -> source_column: grossprofit_margin
        prefix: ""
        suffix: ""
        min_periods: 5              # 最低5年数据要求
        window_size: 5            # 不配置=使用全部数据
        enable_multi_horizon: true  # 启用断点检测
        reference_metrics: ["net_margin"]  # 交叉验证（使用标准业务键）
      outputs:
        parameters:
          - name: GrossMargin_Trend_Result

    - name: "store_GrossMargin_Trend"
      component: "data_engine"
      engine: "pandas"
      method:
        - "store"
      parameters:
        path: "data/filter_middle/gross_margin_trend_analysis.csv"
        format: "csv"
        data: "steps.Analyze_GrossMargin_Trend.outputs.parameters.GrossMargin_Trend_Result"

    # ========== 净利率趋势分析 (盈利能力) ==========
    # 效率指标：净利率，综合盈利能力
    # 交叉验证：毛利率（成本结构）、现金流（盈利质量）
    - name: "Analyze_NetMargin_Trend"
      component: "business_engine"
      engine: "duckdb"
      method: ["analyze_metric_trend"]
      parameters:
        data: "steps.Load_Financial_Data.outputs.parameters.Raw_Data"
        group_cols: 'ts_code'
        metric_name: 'net_margin'  # 标准业务键 -> source_column: netprofit_margin
        prefix: ""
        suffix: ""
        min_periods: 5              # 最低5年数据要求
        window_size: 5            # 不配置=使用全部数据
        reference_metrics: ["gross_margin", "ocf"]  # 交叉验证（使用标准业务键）
      outputs:
        parameters:
          - name: NetMargin_Trend_Result

    - name: "store_NetMargin_Trend"
      component: "data_engine"
      engine: "pandas"
      method:
        - "store"
      parameters:
        path: "data/filter_middle/net_margin_trend_analysis.csv"
        format: "csv"
        data: "steps.Analyze_NetMargin_Trend.outputs.parameters.NetMargin_Trend_Result"

    # ========== ROE 趋势分析 (股东回报) ==========
    # 效率指标：ROE，股东权益回报率
    # 杜邦分解验证：净利率、ROIC（排除杠杆驱动的虚假高ROE）
    - name: "Analyze_ROE_Trend"
      component: "business_engine"
      engine: "duckdb"
      method: ["analyze_metric_trend"]
      parameters:
        data: "steps.Load_Financial_Data.outputs.parameters.Raw_Data"
        group_cols: 'ts_code'
        metric_name: 'roe'
        prefix: ""
        suffix: ""
        min_periods: 5              # 最低5年数据要求
        window_size: 5            # 不配置=使用全部数据
        enable_multi_horizon: true  # 启用断点检测
        reference_metrics: ["net_margin", "roic"]  # 杠邦分解验证（使用标准业务键）
      outputs:
        parameters:
          - name: ROE_Trend_Result

    - name: "store_ROE_Trend"
      component: "data_engine"
      engine: "pandas"
      method:
        - "store"
      parameters:
        path: "data/filter_middle/roe_trend_analysis.csv"
        format: "csv"
        data: "steps.Analyze_ROE_Trend.outputs.parameters.ROE_Trend_Result"

    # ========== 经营现金流趋势分析 (含金量) ==========
    # 现金流指标：OCF，验证盈利的现金含量
    # 交叉验证：EPS（利润现金比）
    - name: "Analyze_OCF_Trend"
      component: "business_engine"
      engine: "duckdb"
      method: ["analyze_metric_trend"]
      parameters:
        data: "steps.Load_Financial_Data.outputs.parameters.Raw_Data"
        group_cols: 'ts_code'
        metric_name: 'ocf'  # 标准业务键 -> source_column: ocfps
        prefix: ""
        suffix: ""
        min_periods: 5              # 最低5年数据要求
        window_size: 5            # 不配置=使用全部数据
        reference_metrics: ["profit"]  # 现金流与利润交叉验证（使用标准业务键）
      outputs:
        parameters:
          - name: OCF_Trend_Result

    - name: "store_OCF_Trend"
      component: "data_engine"
      engine: "pandas"
      method:
        - "store"
      parameters:
        path: "data/filter_middle/ocf_trend_analysis.csv"
        format: "csv"
        data: "steps.Analyze_OCF_Trend.outputs.parameters.OCF_Trend_Result"

    # ========== 综合报告生成 (Cross-Analysis Report) ==========
    # 直接使用探针分析结果，无需读取CSV文件

    # 🔵 规则驱动报告（基于预设阈值）
    - name: "Generate_Comprehensive_Report"
      component: "business_engine"
      engine: "reporting"
      method: ["report_comprehensive"]
      parameters:
        # 直接接收探针分析结果
        roic_data: "steps.Analyze_ROIC_Trend.outputs.parameters.ROIC_Trend_Result"
        roe_data: "steps.Analyze_ROE_Trend.outputs.parameters.ROE_Trend_Result"
        # roiic_data: 已禁用，数据源缺少 roiic 列
        gross_margin_data: "steps.Analyze_GrossMargin_Trend.outputs.parameters.GrossMargin_Trend_Result"
        net_margin_data: "steps.Analyze_NetMargin_Trend.outputs.parameters.NetMargin_Trend_Result"
        revenue_data: "steps.Analyze_Revenue_Trend.outputs.parameters.Revenue_Trend_Result"
        profit_data: "steps.Analyze_Profit_Trend.outputs.parameters.Profit_Trend_Result"
        ocf_data: "steps.Analyze_OCF_Trend.outputs.parameters.OCF_Trend_Result"
        output_path: "data/comprehensive_analysis_report.md"
      outputs:
        parameters:
          - name: Comprehensive_Report_Path

    # ═══════════════════════════════════════════════════════════════════════════
    # 🧬 T.R.U.T.H. 处理系统 - 专业基因-指标映射
    # ═══════════════════════════════════════════════════════════════════════════
    #
    # 数据流: 8个探针结果 → T.R.U.T.H.处理 → 报告生成
    #
    # 基因映射关系:
    # ├─ 效率指标(ROIC,ROE,ROIIC) → α(周期性), β(资本密度), δ_decay(衰退熵)
    # ├─ 成长指标(营收,利润) → γ(成长动能)
    # ├─ 验证指标(现金流) → V(验证因子)
    # └─ 交叉验证(利润vs现金流,ROE vs ROIC) → δ_fraud(欺诈熵)
    #
    # 三大求解器:
    # ├─ 重力求解器: ROIC阈值计算 (α, β → 动态阈值)
    # ├─ 速度求解器: 增长边界评估 (γ → 增长分类)
    # └─ 结构求解器: 护城河检测 (毛利率斜率 → 侵蚀预警)
    #
    # 因果网络验证:
    #     营收增长 → 利润增长 → 现金流增长
    #         ↓           ↓
    #        ROE ← ROIC
    #         ↓
    #     周期性波动
    # ═══════════════════════════════════════════════════════════════════════════

    # 🧬 Step 1: T.R.U.T.H. 处理（专业基因提取 + 求解器）
    - name: "Process_Truth_System"
      component: "business_engine"
      engine: "truth"
      method: ["process_truth"]
      parameters:
        # 接收探针分析结果 (roiic_data 已禁用)
        roic_data: "steps.Analyze_ROIC_Trend.outputs.parameters.ROIC_Trend_Result"
        roe_data: "steps.Analyze_ROE_Trend.outputs.parameters.ROE_Trend_Result"
        # roiic_data: 已禁用，数据源缺少 roiic 列
        gross_margin_data: "steps.Analyze_GrossMargin_Trend.outputs.parameters.GrossMargin_Trend_Result"
        net_margin_data: "steps.Analyze_NetMargin_Trend.outputs.parameters.NetMargin_Trend_Result"
        revenue_data: "steps.Analyze_Revenue_Trend.outputs.parameters.Revenue_Trend_Result"
        profit_data: "steps.Analyze_Profit_Trend.outputs.parameters.Profit_Trend_Result"
        ocf_data: "steps.Analyze_OCF_Trend.outputs.parameters.OCF_Trend_Result"
      outputs:
        parameters:
          - name: Truth_Processed_Results

    # 🟢 Step 2: T.R.U.T.H. 报告生成（使用处理后的数据）
    - name: "Generate_Truth_Report"
      component: "business_engine"
      engine: "reporting"
      method: ["report_truth"]
      parameters:
        # 使用 T.R.U.T.H. 处理后的结果
        truth_processed: "steps.Process_Truth_System.outputs.parameters.Truth_Processed_Results"
        output_path: "data/truth_analysis_report.md"
      outputs:
        parameters:
          - name: Truth_Report_Path